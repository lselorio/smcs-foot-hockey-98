<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>FOOT HOCKEY 98</title>
  <meta name="description" content="16-bit recess foot hockey on 66 Bond — inspired by St. Michael's Choir School." />
  <meta name="theme-color" content="#121933" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FOOT HOCKEY 98" />
  <meta property="og:description" content="16-bit recess foot hockey on 66 Bond — play morning, lunch &amp; afternoon recess with St. Mike's classmates." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="FOOT HOCKEY 98" />
  <meta name="twitter:description" content="16-bit recess foot hockey on 66 Bond — play morning, lunch &amp; afternoon recess with St. Mike's classmates." />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./styles.css?v=15" />
</head>
<body>
  <main class="cabinet">
    <div class="play-column">
      <div class="screen-bezel">
        <canvas id="game" width="320" height="240" aria-label="Foot Hockey 98 game screen"></canvas>
        <div id="crt-overlay" class="crt-overlay active" aria-hidden="true"></div>
      </div>
      <div id="touch-utility" class="touch-utility" aria-label="Game menu shortcuts"></div>
    </div>

    <section id="touch-controls" class="touch-controls" aria-label="On-screen touch controls">
      <div class="touch-left">
        <div id="touch-stick" class="touch-stick" role="application" aria-label="Move thumbstick">
          <div class="stick-cross" aria-hidden="true"></div>
          <div id="touch-knob" class="stick-knob" aria-hidden="true"></div>
        </div>
      </div>
      <div class="touch-right">
        <button type="button" class="touch-btn btn-pass" data-touch-key="KeyX">
          <span class="btn-title">PASS</span>
          <span class="btn-sub">DROP / SW</span>
        </button>
        <button type="button" class="touch-btn btn-shoot" data-touch-key="KeyZ">
          <span class="btn-title">SHOOT</span>
          <span class="btn-sub">CHECK / STEAL</span>
        </button>
      </div>
    </section>

    <footer class="controls-bar">
      <div class="control-group">
        <span class="label">MOVE</span>
        <kbd>Arrows</kbd> / <kbd>WASD</kbd>
      </div>
      <div class="control-group">
        <span class="label">SHOOT / CHECK / STEAL</span>
        <kbd>Z</kbd> or <kbd>J</kbd>
      </div>
      <div class="control-group">
        <span class="label">PASS / DROP / SWITCH / THROW</span>
        <kbd>X</kbd> or <kbd>K</kbd>
      </div>
      <div class="control-group">
        <span class="label">PAUSE / SNOW / CRT / MUSIC</span>
        <kbd>P</kbd> <kbd>B</kbd> <kbd>T</kbd> <kbd>N</kbd>
      </div>
      <div id="pad-status" class="pad-badge" title="Connect any USB or Bluetooth controller and press any button">
        PAD: PLUG IN &amp; PRESS ANY BUTTON
      </div>
    </footer>
  </main>
  <script type="module" src="./src/main.js?v=15"></script>
</body>
</html>
